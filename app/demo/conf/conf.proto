syntax = "proto3";

package demo.conf;

option go_package = "github.com/CycleZero/rym/app/demo/conf;conf";

// Config 是 demo 服务的**自有配置**（拆分微服务时整目录搬走）。
//
// 进程级配置（DB/Redis/日志/OTel）不在这里：见仓库根 conf/common.proto。
message Config {
  // 列表分页默认值/上限；0 表示使用代码内默认值。
  uint32 default_page_size = 1;
  uint32 max_page_size = 2;
}
