version: v2

# 模块划分与服务目录一一对应：新增服务只需加 api/<svc> 与 app/<svc>。
modules:
  - path: api
  - path: conf
  - path: app
  - path: third_party

lint:
  use:
    - STANDARD
  except:
    # 配置包/内部包不引入 v1 版本后缀（与 Kratos 官方 conf.proto 一致）
    - PACKAGE_VERSION_SUFFIX
    # 每个模块（api / conf / app）是独立根，配置包 file 直接位于模块根
    - PACKAGE_DIRECTORY_MATCH
    # 契约保持 Ergonomic：CreateDemo 直接返回 Demo，不强制 XxxResponse
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
